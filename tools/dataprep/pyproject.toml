[project]
name = "bangla-dataprep"
version = "0.1.0"
description = "Curation CLI for speech datasets (spec 2026-11-24-speech-dataset-preparation-design.md)"
requires-python = ">=3.12,<3.13"
# Base install: what the pure-Python steps and the tests need.
dependencies = [
  "bangla-voice-backend[audio]",
  "bnunicodenormalizer",  # MIT
  "librosa>=0.10",
  "pandas",
  "pydantic>=2",
  "pyarrow",
  "pyloudnorm",
  "pyyaml",
]

[project.optional-dependencies]
# CosyVoice 3 round-trip gate (spec §12). Upstream CosyVoice is not a pip package:
# scripts/setup_cosyvoice.sh clones it, and the gate adds it to sys.path at runtime.
# Versions follow upstream requirements.txt, except torch (cu128 for the RTX 5090)
# and onnxruntime-gpu (CUDA 12 builds).
cosyvoice = [
  "torch==2.7.1",
  "torchaudio==2.7.1",
  "transformers==4.51.3",  # < 4.53: CosyVoice issue #1953, output collapses on newer versions
  "accelerate",
  "huggingface_hub",
  "onnxruntime-gpu>=1.20",
  "openai-whisper==20231117",
  "conformer==0.3.2",
  "diffusers==0.29.0",
  "HyperPyYAML==1.2.3",
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "inflect==7.3.1",
  "lightning==2.2.4",
  "matplotlib",
  "modelscope==1.20.0",
  "x-transformers==2.11.24",
  "pyworld==0.3.4",
  "wetext==0.0.4",
  "numpy<2",
]

# DNSMOS (torchmetrics) and Brouhaha SNR/C50/VAD scoring (spec 6.1). The pyannote/brouhaha weights are
# gated on Hugging Face: set HF_TOKEN at runtime. brouhaha pins pyannote.audio<3.3.1, speechbrain<1.0, numpy<2.
score = [
  "torch==2.7.1",
  "torchaudio==2.7.1",
  "torchmetrics[audio]>=1.4",
  "onnxruntime-gpu>=1.20",
  "brouhaha",
  "speechbrain",
  "scikit-learn",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# openai-whisper 20231117 (upstream CosyVoice pin) imports pkg_resources in setup.py,
# which setuptools 81 removed.
build-constraint-dependencies = ["setuptools<81"]
# Some dependencies (e.g. torchmetrics[audio] extras) pull the CPU `onnxruntime` wheel, which shares its
# import name with onnxruntime-gpu and would shadow it. The never-true marker removes it from resolution.
override-dependencies = ["onnxruntime ; sys_platform == 'never'"]

[tool.uv.sources]
bangla-voice-backend = { path = "../../backend", editable = true }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
brouhaha = { git = "https://github.com/marianne-m/brouhaha-vad", rev = "9132cbe62ac78f90abdbc21bcf6ec6cfe9bb4891" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dataprep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
