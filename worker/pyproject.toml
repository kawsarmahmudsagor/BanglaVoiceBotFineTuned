[project]
name = "mlops-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["mlops-api", "mlops-shared", "mlflow-skinny>=2.14"]

[tool.uv.sources]
mlops-api = { workspace = true }
mlops-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlops_worker"]
