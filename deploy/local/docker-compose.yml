# Local Windows development only (used by run-local.bat): Postgres and MLflow.
# The API, worker and web app run natively on the host. Ports are bound to 127.0.0.1.
name: banglavoice-local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: mlops
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops -d mlops"]
      interval: 3s
      timeout: 3s
      retries: 30

  mlflow:
    build: ../mlflow
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      mlflow server
      --backend-store-uri postgresql://mlops:localdev@postgres:5432/mlflow
      --artifacts-destination /mlartifacts
      --serve-artifacts
      --allowed-hosts "localhost:5000,127.0.0.1:5000"
      --host 0.0.0.0 --port 5000
    volumes:
      - mlartifacts:/mlartifacts
    ports:
      - "127.0.0.1:5000:5000"

volumes:
  pgdata:
  mlartifacts:
