id: gemma-3-4b-it
task: llm-sft
name: Gemma 3 4B-it
hf_repo: google/gemma-3-4b-it
params: 4B
role: comparison
license:
  id: gemma
  commercial_ok: true
  url: https://gemma.ai/resources/terms/
  notes: |
    The Gemma Terms of Use allow use, modification and distribution of derivatives, which covers commercial use,
    but they incorporate the Gemma Prohibited Use Policy. Anyone you give the model or a fine-tune to must receive
    the terms, and the use restrictions must be passed on in your agreements with them. The weights are gated on Hugging Face.
bangla:
  status: related
  evidence: >-
    The model card says Gemma 3 supports over 140 languages but does not list them, so Bangla support
    is likely but not confirmed from the card. Test Bangla quality before relying on it.
  url: https://ai.google.dev/gemma/docs/core/model_card_3
runtime:
  engine: llama-server
  convert: gguf
  streaming: true
description: |
  Google's 4B instruction-tuned Gemma 3 model, multimodal (text and image in, text out) with a 128K context.
  Here it is a comparison point for Qwen3-4B on the same Bangla e-commerce data.
dataset:
  format: llm-sft
  required_fields: [messages]
  optional_fields: [tools, tags]
  example: >-
    {"messages": [{"role": "system", "content": "তুমি একটি অনলাইন দোকানের সহকারী।"},
    {"role": "user", "content": "আমার অর্ডার কবে আসবে? অর্ডার নম্বর ১২৩৪৫।"},
    {"role": "assistant", "content": "আপনার অর্ডার ১২৩৪৫ আগামীকাল বিকেলের মধ্যে পৌঁছে যাবে।"}]}
  recommended:
    conversations: "2k-20k"
    turns: "1-8"
    language: "bn (Bangla script), code-mixed allowed"
  notes: |
    Normalise Bangla text to Unicode NFC and use one digit style (Bangla or Latin) consistently.
    Replies are spoken by TTS, so assistant turns must be plain text: no markdown, lists or emoji.
finetune:
  methods: [qlora, lora, full]
  frameworks: [unsloth, transformers]
  targets:
    - "LoRA adapters on all attention and MLP projections (`q_proj`, `k_proj`, `v_proj`, `o_proj`, `gate_proj`, `up_proj`, `down_proj`), rank 16-32."
    - "Compute the loss on assistant turns only; mask system and user tokens."
    - "Keep the model's own chat template, and serve with the same template after GGUF export."
    - "Measure tokenizer efficiency on Bangla (tokens per word) before training; it sets the usable context and latency."
  hyperparams:
    learning_rate: 2.0e-4
    epochs: 2
    max_seq_len: 2048
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    per_device_batch_size: 4
    grad_accum: 4
    warmup_ratio: 0.03
  metrics: [eval_loss, judge_score, refusal_rate]
  pitfalls:
    - "Catastrophic forgetting of instruction following when epochs or learning rate are too high; keep 10-20% general instruction data in the mix."
    - "Chat-template mismatch between training and `llama-server` serving produces broken or looping replies."
    - "Markdown leaking into replies, which TTS then reads aloud. Filter it out of training data."
recipe_template:
  method: {type: qlora}
  hparams:
    learning_rate: 2.0e-4
    epochs: 2
    max_seq_len: 2048
    lora_r: 16
    lora_alpha: 32
  export: [gguf]
sources:
  - title: Gemma 3 4B-it model card
    url: https://huggingface.co/google/gemma-3-4b-it
  - title: Gemma 3 model card (languages)
    url: https://ai.google.dev/gemma/docs/core/model_card_3
  - title: Gemma Terms of Use
    url: https://gemma.ai/resources/terms/
verified: 2026-11-23
