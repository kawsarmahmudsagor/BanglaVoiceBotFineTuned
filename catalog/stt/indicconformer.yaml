id: indicconformer
task: asr
name: IndicConformer Bengali (hybrid CTC-RNNT)
hf_repo: ai4bharat/indicconformer_stt_bn_hybrid_ctc_rnnt_large
params: 120M
role: primary
license:
  id: mit
  commercial_ok: true
  url: https://huggingface.co/ai4bharat/indicconformer_stt_bn_hybrid_ctc_rnnt_large
  notes: Gated on Hugging Face (agree to share contact details). A 600M multilingual version (22 languages, MIT) is ai4bharat/indic-conformer-600m-multilingual.
bangla:
  status: native
  evidence: >-
    AI4Bharat's Conformer, trained on Bengali speech; the card's language is Bengali. Zero-shot on our VM
    (2026-11-25, bn_normalize asr, RNN-T greedy): Bengali.AI valid 1k WER 11.48% / CER 2.20%; FLEURS bn test
    WER 14.91% / CER 4.11%. That FLEURS score is the best of the models whose result is not contaminated.
  url: https://huggingface.co/ai4bharat/indicconformer_stt_bn_hybrid_ctc_rnnt_large
runtime:
  engine: custom
  convert: onnx
  streaming: false
description: |
  A 120M Conformer with both CTC and RNN-T decoders, trained by AI4Bharat for Bengali. It takes 16 kHz mono audio.
  It is small and fast, so it suits a GPU shared with the LLM and TTS. There is no RealtimeSTT engine for it yet (`custom`).
dataset:
  format: asr
  required_fields: [file, text]
  optional_fields: [region, channel, noise, speaker]
  example: "clips/0001.wav,আমার অর্ডারটা কবে পৌঁছাবে জানাবেন?"
  recommended:
    hours: "10-100"
    sample_rate: "16000"
    clip_seconds: "1-30"
    speakers: "100+ for speaker variety"
  notes: |
    Upload as a zip with `metadata.csv` (columns `file,text`) and the audio files. Transcripts in Bangla script,
    Unicode NFC, with numbers written the way they are spoken (for example "১২৩" as "একশো তেইশ") if the model
    should output words. Keep phone-call audio (8 kHz upsampled) in the mix if the bot serves calls.
finetune:
  methods: [full]
  frameworks: [nemo]
  targets:
    - "The .nemo file was saved by AI4Bharat's NeMo fork with 22 language heads. The nemo backend converts it to a Bangla-only model for stock NeMo 3.0 on load (mlops_backend/multilingual.py). No fork is needed."
    - "Keep the existing Bengali tokenizer; train both the CTC and RNN-T heads (hybrid loss)."
    - "Train the whole model at first; with under 10 h of data, freeze the lower half of the encoder."
  hyperparams:
    learning_rate: 1.0e-4
    max_epochs: 20
    batch_size: 16
    ctc_loss_weight: 0.3
  metrics: [wer, cer]
  pitfalls:
    - "Stock NeMo cannot load the raw checkpoint (KeyError 'dir'). Always load it through the backend's conversion. Its RNN-T embedding must use local token ids (rows 0-255); offset rows decode as repeated tokens."
    - "The card's sample code names a different repo id (`..._hybrid_rnnt_large`); use the repo id above."
recipe_template:
  backend: nemo
  method: {type: full}
  hparams:
    learning_rate: 1.0e-4
    epochs: 20
  export: [nemo]
sources:
  - title: IndicConformer Bengali model card
    url: https://huggingface.co/ai4bharat/indicconformer_stt_bn_hybrid_ctc_rnnt_large
  - title: IndicConformer 600M multilingual model card
    url: https://huggingface.co/ai4bharat/indic-conformer-600m-multilingual
verified: 2026-11-25
