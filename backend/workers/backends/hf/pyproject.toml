[project]
name = "mlops-backend-hf"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bangla-voice-backend[prepare,audio]",
  "torch==2.7.1",
  "torchaudio==2.7.1",
  "transformers",
  "datasets",
  "accelerate",
  "evaluate",
  "huggingface_hub",
  # 4.6.3+ passes dtype= to from_pretrained; transformers 4.46.1 (parler pin) only knows torch_dtype.
  "ctranslate2<4.6.3",
  "parler-tts",
  "descript-audio-codec",
]

[dependency-groups]
dev = ["pytest", "jsonschema"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
bangla-voice-backend = { path = "../../..", editable = true }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
parler-tts = { git = "https://github.com/huggingface/parler-tts", rev = "d108732cd57788ec86bc857d99a6cabd66663d68" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlops_backend"]
