[project]
name = "mlops-backend-qwen-asr"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bangla-voice-backend[prepare,audio]",
  "torch==2.7.1",
  "torchaudio==2.7.1",
  # Qwen3ASRForConditionalGeneration + its processor and chat template (worked on the VM, 2026-11-25).
  # Own venv: the hf backend is held at transformers 4.46.1 by parler-tts. The `qwen-asr` pip package is not used.
  "transformers==5.24.1",
  "accelerate",
  "huggingface_hub",
  "librosa",
  "soundfile",
  "jinja2",  # chat templates
]

[dependency-groups]
dev = ["pytest", "jsonschema"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
bangla-voice-backend = { path = "../../..", editable = true }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlops_backend"]
