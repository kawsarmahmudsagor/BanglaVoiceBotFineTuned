[project]
name = "mlops-backend-cosyvoice"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bangla-voice-backend[prepare,audio]",
  "torch==2.7.1",
  "torchaudio==2.7.1",
  "huggingface_hub",
  # onnxruntime-gpu: PyPI wheels from 1.19 on are built for CUDA 12 (upstream's 1.18.0 is CUDA 11.8).
  "onnxruntime-gpu==1.20.2",
  # Upstream CosyVoice requirements.txt at the pinned commit (see UPSTREAM_COMMIT), minus torch*, deepspeed,
  # tensorrt*, fastapi*, uvicorn, gradio, grpcio*, gdown and the Windows/macOS onnxruntime variant.
  "conformer==0.3.2",
  "diffusers==0.29.0",
  "hydra-core==1.3.2",
  "HyperPyYAML==1.2.3",
  "inflect==7.3.1",
  "librosa==0.10.2",
  "lightning==2.2.4",
  # lightning 2.2 imports pkg_resources at runtime; setuptools 81 removed it.
  "setuptools<81",
  "matplotlib==3.7.5",
  "modelscope==1.20.0",
  "networkx==3.1",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "onnx==1.16.0",
  "openai-whisper==20231117",
  "protobuf==4.25",
  "pyarrow==18.1.0",
  "pydantic==2.7.0",
  "pyworld==0.3.4",
  "rich==13.7.1",
  "soundfile==0.12.1",
  "tensorboard==2.14.0",
  "transformers==4.51.3",
  "x-transformers==2.11.24",
  "wetext==0.0.4",
  "wget==3.2",
  # Not in upstream requirements.txt but imported by cosyvoice / third_party/Matcha-TTS.
  "einops",
  # upstream parquet_opener reads shards with pyarrow .to_pandas()
  "pandas>=2.2,<3",
  "scipy",
]

[dependency-groups]
dev = ["pytest", "jsonschema"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# openai-whisper 20231117 is sdist-only and its setup.py imports pkg_resources, removed in setuptools 81.
build-constraint-dependencies = ["setuptools<81"]

[tool.uv.sources]
bangla-voice-backend = { path = "../../..", editable = true }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlops_backend"]
