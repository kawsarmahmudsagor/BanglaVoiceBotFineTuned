[project]
name = "mlops-backend-unsloth"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bangla-voice-backend[prepare,audio]",
  "torch==2.7.1",
  "unsloth",
  "torchao<0.16",
  "trl",
  "transformers",
  "datasets",
  "peft",
  "bitsandbytes",
  "accelerate",
  "huggingface_hub",
  "ctranslate2",
]

[dependency-groups]
dev = ["pytest", "jsonschema"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# xformers 0.0.31 FA3 dispatch is broken on SM 12.0 (RTX 5090); unsloth falls back to SDPA without it.
override-dependencies = ["xformers; sys_platform == 'never'"]

[tool.uv.sources]
bangla-voice-backend = { path = "../../..", editable = true }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlops_backend"]
