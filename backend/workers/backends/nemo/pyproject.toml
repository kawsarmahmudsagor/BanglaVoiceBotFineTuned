[project]
name = "mlops-backend-nemo"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bangla-voice-backend[prepare,audio]",
  "torch==2.7.1",
  "nemo_toolkit[asr]",
  "lightning",
  "huggingface_hub",
]

[dependency-groups]
dev = ["pytest", "jsonschema"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
bangla-voice-backend = { path = "../../..", editable = true }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlops_backend"]
