[project]
name = "mlops-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlops-shared[validate]",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg",
  "aiosqlite",
  "alembic>=1.13",
  "pydantic-settings>=2.2",
  "pyyaml",
  "pyarrow",
  "numpy",
  "soundfile",
  "pyloudnorm",
  "nvidia-ml-py",
  "sse-starlette",
  "python-multipart",
]

[tool.uv.sources]
mlops-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlops_api"]
